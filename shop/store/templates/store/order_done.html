{% extends "store/base.html" %}
{% block content %}
<div class="card empty" style="max-width:520px;margin:0 auto">
  <div class="big">🎉</div>
  <h1>Дякуємо! Замовлення №{{ order.pk }} прийнято</h1>
  <p>Сума: <b>{{ order.total|floatformat:0 }} ₴</b>. Ми зателефонуємо на {{ order.phone }} для підтвердження.</p>
  <a class="btn" href="{% url 'home' %}">На головну</a>
</div>
{% endblock %}
